name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install package
        run: uv sync --frozen --extra dev

      # Informational for now: the codebase has ~786 pre-existing ruff findings.
      # Make this blocking after a dedicated lint-cleanup pass.
      - name: Ruff (lint, non-blocking)
        continue-on-error: true
        run: uv run ruff check kaggle_agents tests notebooks

      - name: Pytest
        env:
          LLM_PROVIDER: openai
          OPENAI_API_KEY: ci-dummy-key
          KAGGLE_USERNAME: ci-dummy
          KAGGLE_KEY: ci-dummy
        run: uv run pytest tests -q
