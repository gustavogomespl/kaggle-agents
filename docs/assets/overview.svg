<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="374" viewBox="0 0 1120 374" role="img" aria-labelledby="title desc">
  <title id="title">Schematic overview of the Kaggle Agents MLE-bench workflow</title>
  <desc id="desc">Four grouped stages: six sequential data-preparation nodes; initial search and planning; development and robustness validation; submission, local evaluation and recovery. A bounded refinement route returns to the planner. KaggleState holds shared contracts and execution evidence. The full workflow diagram details the conditional branches.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#222"/></marker>
    <marker id="recovery" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#376c9e"/></marker>
  </defs>
  <rect width="1120" height="374" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#111" text-anchor="middle">
    <text x="560" y="24" font-size="17">Schematic overview of the MLE-bench workflow</text>
    <g font-size="14" font-style="italic">
      <text x="138" y="63">Data preparation (6 nodes)</text>
      <text x="416" y="63">Search and planning</text>
      <text x="694" y="63">Development and validation</text>
      <text x="972" y="63">Evaluation and recovery</text>
    </g>
    <g stroke="#222" stroke-width="1.3">
      <rect x="22" y="84" width="232" height="150" rx="3" fill="#eaeaea"/>
      <rect x="312" y="94" width="208" height="50" rx="3" fill="#f2b544"/>
      <rect x="312" y="184" width="208" height="50" rx="3" fill="#fff"/>
      <rect x="590" y="94" width="208" height="50" rx="3" fill="#fff"/>
      <rect x="590" y="184" width="208" height="50" rx="3" fill="#fff"/>
      <rect x="856" y="84" width="232" height="150" rx="3" fill="#cfe0ed"/>
    </g>
    <g font-size="14">
      <text x="138" y="107">format discovery</text>
      <text x="138" y="130">data validation</text>
      <text x="138" y="153">domain detection</text>
      <text x="138" y="176">data audit</text>
      <text x="138" y="199">canonical data preparation</text>
      <text x="138" y="222">data exploration</text>
      <text x="416" y="115">search</text>
      <text x="416" y="133" font-size="12">(Search First)</text>
      <text x="416" y="214">planner</text>
      <text x="694" y="115">developer</text>
      <text x="694" y="133" font-size="12">(component refinement)</text>
      <text x="694" y="214">robustness + gate</text>
      <text x="972" y="111">ensemble / submission</text>
      <text x="972" y="138">local performance evaluation</text>
      <text x="972" y="165">meta-evaluation and recovery</text>
      <text x="972" y="192">iteration control / reporting</text>
      <text x="972" y="221" font-size="12">refine or terminate</text>
    </g>
    <g fill="none" stroke="#222" stroke-width="1.3" marker-end="url(#arrow)">
      <path d="M254 159 H280 V119 H312"/>
      <path d="M416 144 V184"/>
      <path d="M520 209 H553 V119 H590"/>
      <path d="M694 144 V184"/>
      <path d="M798 209 H828 V159 H856"/>
    </g>
    <path d="M972 234 V280 H416 V234" fill="none" stroke="#376c9e" stroke-width="1.6" marker-end="url(#recovery)"/>
    <text x="696" y="271" fill="#376c9e" font-size="13">refine, subject to budget and iteration limit</text>
    <rect x="22" y="303" width="1066" height="40" fill="#f6f6f6" stroke="#777" stroke-width="1" stroke-dasharray="5 3"/>
    <text x="555" y="328" font-size="14"><tspan font-style="italic">Shared state (KaggleState):</tspan> metric, data and submission contracts; candidates; validation and execution history</text>
    <text x="555" y="365" font-size="12">Stages are grouped here; the complete workflow details the conditional branches and failure routes.</text>
  </g>
</svg>
